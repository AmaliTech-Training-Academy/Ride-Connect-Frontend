name: Deploy Frontend (dev)

# test comment to trigger a build

on:
  push:
    branches: 
      - develop
      - feat/RID-21-ci-cd # temporary branch for testing

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        # If your app needs build-time env vars (API base URL, etc.),
        # add them here or via a repo/environment secret.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure EC2 instance is running
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Current state: $STATE"
          if [ "$STATE" != "running" ]; then
            echo "Instance is not running (Current: $STATE)." >&2
            exit 1
            # aws ec2 start-instances --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            # aws ec2 wait instance-running --instance-ids ${{ secrets.EC2_INSTANCE_ID }}
            # sleep 15
            # reason for those commented out commands, is that I hope no code is merged into develop during off hours (TBD..yeah)
          fi

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync build to a staging dir on the server
        run: |
          rsync -avz --delete ./dist/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/frontend/dist_new/

      - name: Atomically swap into place
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
            set -e
            rm -rf /var/www/frontend/dist_old
            mv /var/www/frontend/dist /var/www/frontend/dist_old 2>/dev/null || true
            mv /var/www/frontend/dist_new /var/www/frontend/dist
          '