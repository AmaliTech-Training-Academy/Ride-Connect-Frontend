name: Deploy Frontend (docker)

on:
  push:
    branches:
      - feat/RID-55-docker

concurrency:
  group: deploy-frontend-docker
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/amalitech-training-academy/ride-connect-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ensure EC2 instance is running
        env:
          INSTANCE_ID: ${{ secrets.DOCKER_EC2_INSTANCE_ID }}
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "Current state: $STATE"
          case "$STATE" in
            running) ;;
            pending)
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" ;;
            stopping|stopped)
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" ;;
            *)
              echo "Instance cannot be started from state: $STATE" >&2
              exit 1 ;;
          esac

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DOCKER_EC2_SSH_KEY }}

      - name: Wait for SSH and add host to known_hosts
        env:
          HOST: ${{ secrets.DOCKER_EC2_HOST }}
        run: |
          for attempt in $(seq 1 30); do
            KEYS=$(ssh-keyscan -H "$HOST" 2>/dev/null || true)
            if [ -n "$KEYS" ]; then
              echo "$KEYS" >> ~/.ssh/known_hosts
              exit 0
            fi
            echo "SSH not ready (attempt $attempt), retrying..."
            sleep 10
          done
          echo "SSH never became reachable on $HOST" >&2
          exit 1

      - name: Point FRONTEND_TAG at the new image and recreate the service
        id: deploy
        env:
          TARGET: ${{ secrets.DOCKER_EC2_USER }}@${{ secrets.DOCKER_EC2_HOST }}
        run: |
          ssh "$TARGET" "TAG=$TAG bash -s" <<'EOF'
            set -euo pipefail
            cd /opt/ride-connect

            if [ ! -r .env ] || [ ! -w .env ]; then
              echo "/opt/ride-connect/.env must be readable and writable by $(whoami)" >&2
              exit 1
            fi

            TMP=$(mktemp)
            grep -v '^FRONTEND_TAG=' .env > "$TMP" || true
            echo "FRONTEND_TAG=$TAG" >> "$TMP"
            cat "$TMP" > .env
            rm -f "$TMP"
            echo "FRONTEND_TAG set to $TAG"

            if docker compose config --services | grep -qx frontend; then
              docker compose up -d frontend
              echo "recreated=true" > /tmp/frontend-deploy-result
            else
              echo "No frontend service in compose.yml yet; skipping recreate."
              echo "recreated=false" > /tmp/frontend-deploy-result
            fi
          EOF
          ssh "$TARGET" cat /tmp/frontend-deploy-result >> "$GITHUB_OUTPUT"

      - name: Verify the site
        if: steps.deploy.outputs.recreated == 'true'
        env:
          TRIAL_URL: ${{ vars.DOCKER_TRIAL_URL }}
        run: |
          URL="${TRIAL_URL%/}"
          fetch() {
            curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$1"
          }

          fetch "$URL/" | grep -q 'id="root"'
          echo "SPA served at $URL/"

          fetch "$URL/deploy-check-client-route" | grep -q 'id="root"'
          echo "Client-side route falls back to index.html"

          fetch "$URL/api/health" > /dev/null
          echo "API still healthy at $URL/api/health"
